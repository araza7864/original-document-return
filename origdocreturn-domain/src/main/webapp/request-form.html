<!DOCTYPE html>
<html>
<head><title>Document Request</title></head>
<body>

<h1>Submit Document Return Request</h1>

<form action="submitRequest" method="POST">
    First Name: <input type="text" name="firstName" required><br><br>
    Last Name: <input type="text" name="lastName" required><br><br>
    Email: <input type="text" name="email" required><br><br>
    Phone: <input type="text" name="phone" required><br><br>
    Document Type: <input type="text" name="docType" required><br><br>
    Preferred Return Method: <input type="text" name="returnMethod" required><br><br>
    Reason for Request: <input type="text" name="reason" required><br><br>
    <input type="submit" value="Submit Request">
</form>

</body>
</html>
